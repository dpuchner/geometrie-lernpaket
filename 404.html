<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometrie-Lernpaket</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:600px;margin:60px auto;padding:0 20px;color:#1b1f27}a{display:inline-block;margin-top:16px;padding:14px 22px;background:#1f4e9c;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}</style>
</head><body>
<h1>📐 Geometrie-Lernpaket</h1>
<p>Diese Seite gibt es nicht. Du wirst gleich weitergeleitet …</p>
<a id="go" href="/geometrie-lernpaket/">Zur Startseite</a>
<script>
(function(){
  var base='/geometrie-lernpaket/';
  var files=['index.html','Trainer.html','Spickzettel.html','Uebungen_Aufgaben.html','Uebungen_Loesungen.html','Probetest.html','Probetest_Loesungen.html',
    'PDF/1_Spickzettel.pdf','PDF/2_Uebungsblaetter_Aufgaben.pdf','PDF/3_Uebungsblaetter_Loesungen.pdf','PDF/4_Probetest.pdf','PDF/5_Probetest_Loesungen.pdf'];
  var p=decodeURIComponent(location.pathname).toLowerCase();
  var rest=p.indexOf(base)===0?p.slice(base.length):'';
  var target=base;
  for(var i=0;i<files.length;i++){if(files[i].toLowerCase()===rest||files[i].toLowerCase().replace('.html','')===rest){target=base+files[i];break;}}
  target+=location.hash;
  document.getElementById('go').href=target;
  setTimeout(function(){location.replace(target);},800);
})();
</script>
</body></html>
